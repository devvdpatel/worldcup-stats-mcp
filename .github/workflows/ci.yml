name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: pip install --prefer-binary -r requirements.txt

      - name: Byte-compile (syntax check)
        run: python -m compileall config.py etl analysis mcp_server assistant tests

      - name: Import smoke test
        run: python -c "import config, etl.load, etl.model, etl.extract, etl.fbref_meta, etl.asa, etl.xref, etl.mls_model, etl.export, analysis.findings, mcp_server.server, assistant.cli; print('imports OK')"

      - name: Tests (unit tests; warehouse data-quality tests skip without data/)
        run: python -m pytest
